<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prova demo</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Só pra vitrine: abre uma prova isolada. ?p=0..4 &m=foto mostra o molde com a foto de exemplo. */
:root{--amarelo:#FDC72F;--preto:#111}body{margin:0;background:#141210}*{box-sizing:border-box}button{cursor:pointer}
.btn{font-family:Anton;font-weight:400;font-size:17px;letter-spacing:.08em;text-transform:uppercase;background:var(--amarelo);color:var(--preto);height:48px;padding:0 22px;border-radius:4px;border:0;
  box-shadow:0 0 0 2px var(--preto),4px 4px 0 2px var(--preto);display:inline-flex;align-items:center;justify-content:center;gap:10px}
</style></head><body>
<script>
const achadas=[],marcar=()=>{},fotoKey=n=>'demo-'+n,pintarAlbum=()=>{},toast=()=>{},vibra=()=>{},dois=n=>String(n).padStart(2,'0');
</script>
<script src="prova.js?v=2"></script>
<script>
const u=new URLSearchParams(location.search),p=+u.get('p')||0;
document.fonts.ready.then(async()=>{
  if(u.get('m')!=='foto')return Prova.abrir(p,()=>{});
  Prova.abrir(p,()=>{});document.getElementById('pvOk').click();
  const b=await (await fetch('assets/foto-familia.png')).blob(),dt=new DataTransfer();dt.items.add(new File([b],'f.png',{type:'image/png'}));
  const i=document.getElementById('pvArq');i.files=dt.files;i.dispatchEvent(new Event('change'));
});
</script></body></html>
