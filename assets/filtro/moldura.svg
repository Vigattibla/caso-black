<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- Moldura da foto de detetive para stories · 1080x1920 · a foto entra pelo furo da folha (janela 720x820, girada -2,5°).
       Textos ficam entre y=250 e y=1670 (faixas de cima e de baixo são cobertas pela interface do Instagram).
       Se mexer na folha ou no furo, atualizar JANELA em filtro.js. Fontes: Anton, Courier Prime, Caveat. -->
  <defs>
    <mask id="furo" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
      <rect width="1080" height="1920" fill="#fff"/>
      <rect x="180" y="345" width="720" height="820" fill="#000" transform="translate(0 80) rotate(-2.5 540 770)"/>
    </mask>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="sombraP" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".3"/></filter>
    <filter id="grao"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .25  0 0 0 0 .18  0 0 0 0 .1  0 0 0 .09 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <radialGradient id="mesa" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#2a221c"/><stop offset="1" stop-color="#0d0b0a"/></radialGradient>
    <linearGradient id="kraftF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D3A95A"/><stop offset="1" stop-color="#B8853F"/></linearGradient>
  </defs>

  <!-- tudo o que fica atrás da foto leva o furo -->
  <g mask="url(#furo)">
    <rect width="1080" height="1920" fill="url(#mesa)"/>
    <!-- pasta (costas) com a aba -->
    <g filter="url(#sombra)">
      <path d="M60 1342 H1020 V1920 H60 Z" fill="#C99A5B"/>
    </g>
    <!-- folha saindo da pasta -->
    <g transform="translate(0 80) rotate(-2.5 540 770)">
      <rect x="90" y="120" width="900" height="1300" fill="#F4F1EA" filter="url(#sombra)"/>
      <rect x="90" y="120" width="900" height="1300" fill="#F4F1EA" filter="url(#grao)"/>
      <text x="150" y="190" font-family="'Courier Prime', monospace" font-weight="700" font-size="22" letter-spacing="3" fill="#555">VILLAGE RESORT · DEPTO. DE INVESTIGAÇÃO</text>
      <rect x="800" y="160" width="130" height="44" fill="#111"/>
      <text x="865" y="190" text-anchor="middle" font-family="'Courier Prime', monospace" font-weight="700" font-size="22" letter-spacing="2" fill="#fff">FICHA</text>
      <rect x="150" y="222" width="780" height="3" fill="#111"/>
      <text x="150" y="312" font-family="Anton, Impact, sans-serif" font-size="74" fill="#111">INVESTIGADOR OFICIAL</text>
      <!-- foto revelada (borda branca da evidência) -->
      <rect x="162" y="327" width="756" height="916" fill="#fff" filter="url(#sombraP)"/>
      <text x="540" y="1212" text-anchor="middle" font-family="'Courier Prime', monospace" font-weight="700" font-size="25" letter-spacing="3" fill="#333">EVIDÊNCIA FINAL · O DETETIVE</text>
      <text x="160" y="1318" font-family="Caveat, cursive" font-weight="700" font-size="58" fill="#2b3a8f">pegou o Bê no flagra!</text>
      <text x="930" y="1318" text-anchor="end" font-family="Caveat, cursive" font-weight="700" font-size="54" fill="#2b3a8f">#CasoBlack</text>
    </g>
  </g>

  <!-- por cima da foto -->
  <g transform="translate(0 80) rotate(-2.5 540 770)">
    <!-- clipe -->
    <g transform="translate(214 318)" fill="none" stroke="#8d949b" stroke-width="9" stroke-linecap="round" filter="url(#sombraP)">
      <path d="M14 150 V20 a20 20 0 0 1 40 0 V170 a30 30 0 0 1 -60 0 V40"/>
    </g>
    <!-- fita no canto -->
    <rect x="842" y="316" width="150" height="46" fill="#efe6b0" opacity=".85" transform="rotate(38 917 339)"/>
    <!-- carimbo -->
    <g transform="rotate(-12 760 1080)" opacity=".88">
      <rect x="600" y="1030" width="320" height="104" rx="10" fill="none" stroke="#C8102E" stroke-width="7"/>
      <text x="760" y="1080" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="44" letter-spacing="3" fill="#C8102E">CASO</text>
      <text x="760" y="1122" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="38" letter-spacing="4" fill="#C8102E">RESOLVIDO</text>
    </g>
  </g>

  <!-- pasta (frente): a folha entra nela -->
  <g filter="url(#sombra)">
    <path d="M40 1482 L1040 1460 V1920 H40 Z" fill="url(#kraftF)"/>
  </g>
  <path d="M40 1482 L1040 1460 V1920 H40 Z" fill="#000" filter="url(#grao)"/>
  <path d="M40 1482 L1040 1460" stroke="#e6c27f" stroke-width="3"/>
  <!-- aba da pasta com o número do caso -->
  <g transform="translate(0 80) rotate(-1.26 840 1385)">
    <path d="M660 1386 Q666 1330 702 1328 H978 Q1014 1330 1020 1386 Z" fill="#D3A95A" filter="url(#sombraP)"/>
    <text x="840" y="1368" text-anchor="middle" font-family="'Courier Prime', monospace" font-weight="700" font-size="24" letter-spacing="3" fill="#5a3d17">CASO Nº 2026-BF</text>
  </g>
  <image href="../cb-logo.png" x="80" y="1505" width="380" height="150"/>
  <g transform="translate(0 30) rotate(-7 840 1520)" opacity=".85">
    <rect x="690" y="1484" width="300" height="74" rx="8" fill="none" stroke="#C8102E" stroke-width="6"/>
    <text x="840" y="1538" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="42" letter-spacing="4" fill="#C8102E">CONFIDENCIAL</text>
  </g>
  <text x="1000" y="1646" text-anchor="end" font-family="'Courier Prime', monospace" font-weight="700" font-size="22" letter-spacing="2" fill="#4a3112">VILLAGE RESORT · BLACK FRIDAY 2026</text>
</svg>
