<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caso Black · Telão</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#111;color:#fdc72f;overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr auto;font-family:'Courier Prime',monospace}
header{display:flex;align-items:center;gap:2vw;padding:2vh 3vw;border-bottom:.6vh solid #fdc72f}
header img{height:9vh}
header h1{font:400 6vh Anton,sans-serif;letter-spacing:.05em;color:#fff}
header span{margin-left:auto;font-size:3vh;color:#fdc72f}
main{display:grid;grid-template-columns:1.1fr 1fr;gap:3vw;padding:3vh 3vw;min-height:0}
.palco{position:relative;display:grid;place-items:center;min-height:0}
.ficha{position:relative;height:100%;max-height:68vh;aspect-ratio:432/528;background:#fffdf6;padding:2vh;box-shadow:0 2vh 6vh #000a}
.ficha img{width:100%;height:100%;object-fit:contain;display:block}
.ficha b{position:absolute;left:0;right:0;top:-5vh;text-align:center;font:400 3.4vh Anton,sans-serif;color:#fdc72f;letter-spacing:.08em}
.carimbo{position:absolute;right:-4vh;bottom:6vh;padding:1vh 2vh;border:.7vh solid #c8102e;color:#c8102e;font:400 5vh Anton,sans-serif;transform:rotate(-12deg);background:#fffdf6cc;opacity:0}
.espera{font:400 5vh Anton,sans-serif;color:#fff;text-align:center;line-height:1.3}
.espera small{display:block;font:3vh 'Courier Prime',monospace;color:#fdc72f}
.mural{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min-content;gap:2vh;align-content:center;min-height:0}
.mural figure{background:#fffdf6;padding:.8vh;aspect-ratio:432/528;transform:rotate(var(--g));box-shadow:0 .8vh 2vh #0008}
.mural img{width:100%;height:100%;object-fit:contain;display:block}
footer{padding:1.6vh 3vw;background:#fdc72f;color:#111;font-size:3vh;display:flex;justify-content:space-between}
</style>
</head>
<body>
<header><img src="../assets/cb-logo.png" alt=""><h1>RETRATOS FALADOS</h1><span id="total"></span></header>
<main>
  <section class="palco" id="palco"><p class="espera">AGUARDANDO O PRÓXIMO DETETIVE…<small>Os retratos aparecem aqui quando o caso é resolvido</small></p></section>
  <section class="mural" id="mural" aria-label="Retratos anteriores"></section>
</main>
<footer><span>CASO BLACK · VILLAGE RESORT</span><span>Desenhe o suspeito na sua carta</span></footer>
<script>
/* Telão: mostra cada retrato falado que chega (jogo no mesmo navegador via localStorage; ?demo simula chegadas). */
const CHAVE = 'cb_tv', MAX = 12, TEMPO = 7000, demo = new URLSearchParams(location.search).has('demo');
const palco = document.querySelector('#palco'), mural = document.querySelector('#mural');
const ler = () => { try { return JSON.parse(localStorage.getItem(CHAVE)) || []; } catch (e) { return []; } };
let vistos = new Set(ler().map(r => r.id)), fila = [], historico = ler().slice(-8), contagem = ler().length, rodando = false;

function desenharMural() {
  mural.innerHTML = historico.slice().reverse().map((r, i) => `<figure style="--g:${(i * 37 % 7) - 3}deg"><img src="${r.img}" alt="Retrato falado"></figure>`).join('');
  if (!rodando) document.querySelector('#total').textContent = contagem ? `${contagem} CASO${contagem > 1 ? 'S' : ''} RESOLVIDO${contagem > 1 ? 'S' : ''}` : '';
}

function mostrar(r) {
  rodando = true; contagem++;
  document.querySelector('#total').textContent = `${contagem} CASO${contagem > 1 ? 'S' : ''} RESOLVIDO${contagem > 1 ? 'S' : ''}`;
  palco.innerHTML = `<div class="ficha"><b>SUSPEITO Nº ${String(contagem).padStart(3, '0')}</b><img src="${r.img}" alt="Retrato falado"><div class="carimbo">É O BÊ!</div></div>`;
  const ficha = palco.querySelector('.ficha');
  ficha.animate([{transform: 'translateY(-110vh) rotate(-8deg)'}, {transform: 'translateY(2vh) rotate(2deg)', offset: .75}, {transform: 'none'}], {duration: 1100, easing: 'cubic-bezier(.3,1.3,.5,1)', fill: 'forwards'});
  palco.querySelector('.carimbo').animate([{opacity: 0, transform: 'rotate(-12deg) scale(3)'}, {opacity: 1, transform: 'rotate(-12deg) scale(1)'}], {duration: 320, delay: 1500, easing: 'ease-in', fill: 'forwards'});
  setTimeout(() => {
    historico = [...historico, r].slice(-8); desenharMural();
    const [novo] = mural.querySelectorAll('figure');
    novo?.animate([{opacity: 0, transform: 'scale(1.6)'}, {opacity: 1}], {duration: 500});
    rodando = false; proximo();
  }, TEMPO);
}
function proximo() { if (!rodando && fila.length) mostrar(fila.shift()); }
function receber(r) { if (!r?.img || vistos.has(r.id)) return; vistos.add(r.id); fila.push(r); proximo(); }

addEventListener('storage', e => { if (e.key === CHAVE) ler().forEach(receber); });
setInterval(() => ler().forEach(receber), 3000); // mesma aba/aparelho sem evento de storage

// Demo: rostos de mentira na guia da carta (cabeça + ombros), com disfarce variado.
function falso() {
  const W = 432, H = 528, c = document.createElement('canvas'), x = c.getContext('2d'), s = Math.random;
  c.width = W; c.height = H; x.fillStyle = '#fffdf6'; x.strokeStyle = '#203b80'; x.lineWidth = 7;
  x.beginPath(); x.moveTo(50, H); x.bezierCurveTo(50, 455, 121, 403, 216, 403); x.bezierCurveTo(311, 403, 381, 455, 381, H); x.closePath(); x.fill(); x.stroke();
  x.beginPath(); x.ellipse(216, 268, 125, 157, 0, 0, 7); x.fill(); x.stroke();
  x.fillStyle = x.strokeStyle = ['#203b80', '#111', '#c8102e'][s() * 3 | 0]; x.lineWidth = 8; x.lineCap = 'round';
  if (s() < .7) { x.fillRect(86, 98, 260, 18); x.fillRect(146, 30 + s() * 20, 140, 72); }
  const oy = 238; x.beginPath();
  if (s() < .6) { x.ellipse(170, oy, 34, 24, 0, 0, 7); x.ellipse(262, oy, 34, 24, 0, 0, 7); x.fill(); x.fillRect(200, oy - 4, 32, 8); }
  else { x.arc(170, oy, 10, 0, 7); x.arc(262, oy, 10, 0, 7); x.fill(); }
  if (s() < .7) { x.beginPath(); x.moveTo(141, 313); x.quadraticCurveTo(216, 263 - s() * 20, 291, 313); x.quadraticCurveTo(216, 298, 141, 313); x.fill(); }
  x.beginPath(); x.arc(216, 323, 42, .3, Math.PI - .3); x.stroke();
  if (s() < .6) { x.beginPath(); x.moveTo(216, 447); x.lineTo(186, 430); x.lineTo(186, 464); x.closePath(); x.moveTo(216, 447); x.lineTo(246, 430); x.lineTo(246, 464); x.closePath(); x.fill(); }
  return {id: 'demo-' + Date.now() + s(), img: c.toDataURL('image/png')};
}
if (demo) { for (let i = 0; i < 5; i++) historico.push(falso()); receber(falso()); setInterval(() => receber(falso()), TEMPO + 1500); }
desenharMural();
</script>
</body>
</html>
