<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caso Black · Telão</title>
<link rel="icon" type="image/png" href="../assets/cb-logo.png?v=20261023">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Unidade --u = 1% do menor lado: o mesmo layout serve TV 16:9, monitor, retrato e celular. */
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#111;color:#fdc72f;overflow:hidden;cursor:none}
body{--u:1vmin;font-family:'Courier Prime',monospace}
#filme{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;transition:opacity .6s}
#telao{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:#111;transition:opacity .6s}
body.video #telao{opacity:0;pointer-events:none}
body:not(.video) #filme{opacity:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:calc(3*var(--u));padding:calc(2.4*var(--u)) calc(4*var(--u));border-bottom:calc(.8*var(--u)) solid #fdc72f}
header img{height:calc(10*var(--u))}
header h1{font:400 calc(7*var(--u)) Anton,sans-serif;letter-spacing:.05em;color:#fff;white-space:nowrap}
header span{margin-left:auto;font-size:calc(3.6*var(--u));text-align:right}
main{display:grid;grid-template-columns:1.1fr 1fr;gap:calc(4*var(--u));padding:calc(4*var(--u));min-height:0}
.palco{position:relative;display:grid;place-items:center;min-height:0;min-width:0}
.ficha{position:relative;height:calc(100% - 7*var(--u));margin-top:calc(6*var(--u));max-height:calc(70*var(--u));max-width:100%;aspect-ratio:432/528;background:#fffdf6;padding:calc(2*var(--u));box-shadow:0 calc(2*var(--u)) calc(6*var(--u)) #000a}
.ficha img{width:100%;height:100%;object-fit:contain;display:block}
.ficha b{position:absolute;left:0;right:0;top:calc(-5.5*var(--u));text-align:center;font:400 calc(4*var(--u)) Anton,sans-serif;color:#fdc72f;letter-spacing:.08em;white-space:nowrap}
.carimbo{position:absolute;right:calc(-4*var(--u));bottom:calc(6*var(--u));padding:var(--u) calc(2*var(--u));border:calc(.8*var(--u)) solid #c8102e;color:#c8102e;font:400 calc(6*var(--u)) Anton,sans-serif;transform:rotate(-12deg);background:#fffdf6cc;opacity:0}
.espera{font:400 calc(6*var(--u)) Anton,sans-serif;color:#fff;text-align:center;line-height:1.3}
.espera small{display:block;font-size:calc(3.4*var(--u));font-family:'Courier Prime',monospace;color:#fdc72f}
.mural{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(15*var(--u)),1fr));grid-auto-rows:min-content;gap:calc(2.4*var(--u));align-content:center;min-height:0;overflow:hidden}
.mural figure{background:#fffdf6;padding:var(--u);aspect-ratio:432/528;transform:rotate(var(--g));box-shadow:0 var(--u) calc(2*var(--u)) #0008}
.mural img{width:100%;height:100%;object-fit:contain;display:block}
footer{padding:calc(2*var(--u)) calc(4*var(--u));background:#fdc72f;color:#111;font-size:calc(3.4*var(--u));display:flex;justify-content:space-between;gap:calc(2*var(--u))}
@media (orientation:portrait){main{grid-template-columns:1fr;grid-template-rows:1.3fr 1fr}header h1{font-size:calc(5.5*var(--u))}header span{font-size:calc(3*var(--u))}footer span+span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<video id="filme" muted playsinline preload="auto"></video>
<div id="telao">
  <header><img src="../assets/cb-logo.png" alt=""><h1>RETRATOS FALADOS</h1><span id="total"></span></header>
  <main>
    <section class="palco" id="palco"><p class="espera">AGUARDANDO O PRÓXIMO DETETIVE…<small>Os retratos aparecem aqui quando o caso é resolvido</small></p></section>
    <section class="mural" id="mural" aria-label="Retratos anteriores"></section>
  </main>
  <footer><span>CASO BLACK · VILLAGE RESORT</span><span>Desenhe o suspeito na sua carta</span></footer>
</div>
<script>
/* Telão: vídeos do resort em loop (../assets/tv/playlist.json); quando uma família resolve o caso, o retrato dela
   chega pela VPS (tv.php), entra no telão junto com os anteriores e o vídeo volta de onde parou.
   ES2017 de propósito (navegador de smart TV). ?demo simula chegadas. */
var q = new URLSearchParams(location.search), demo = q.has('demo');
var MAX = 12, TEMPO = 11000, INTERVALO = 8000;
var palco = document.getElementById('palco'), mural = document.getElementById('mural'), filme = document.getElementById('filme');
var vistos = {}, fila = [], historico = [], contagem = 0, rodando = false, ultimo = '', lista = [], faixa = 0;

function rotulo(n) { return n ? n + ' CASO' + (n > 1 ? 'S' : '') + ' RESOLVIDO' + (n > 1 ? 'S' : '') : ''; }
function desenharMural() {
  mural.innerHTML = historico.slice().reverse().map(function (r, i) { return '<figure style="--g:' + ((i * 37 % 7) - 3) + 'deg"><img src="' + r.img + '" alt="" decoding="async"></figure>'; }).join('');
  if (!rodando) document.getElementById('total').textContent = rotulo(contagem);
}

// Vídeo: só ocupa a tela quando há playlist; sem ela o telão fica fixo.
function modoVideo(sim) { document.body.classList.toggle('video', sim && lista.length > 0); if (sim && lista.length) filme.play().catch(function () {}); else filme.pause(); }
function tocar(i) { if (!lista.length) return; faixa = (i + lista.length) % lista.length; filme.src = '../assets/tv/' + lista[faixa]; filme.play().catch(function () {}); }
filme.addEventListener('ended', function () { lista.length === 1 ? (filme.currentTime = 0, filme.play()) : tocar(faixa + 1); });
filme.addEventListener('error', function () { setTimeout(function () { tocar(faixa + 1); }, 2000); });

function mostrar(r) {
  rodando = true; contagem++; modoVideo(false);
  document.getElementById('total').textContent = rotulo(contagem);
  palco.innerHTML = '<div class="ficha"><b>SUSPEITO Nº ' + String(contagem).padStart(3, '0') + '</b><img src="' + r.img + '" alt="Retrato falado"><div class="carimbo">É O BÊ!</div></div>';
  var ficha = palco.querySelector('.ficha');
  if (ficha.animate) {
    ficha.animate([{transform: 'translateY(-110vh) rotate(-8deg)'}, {transform: 'translateY(2vh) rotate(2deg)', offset: .75}, {transform: 'none'}], {duration: 1100, easing: 'cubic-bezier(.3,1.3,.5,1)', fill: 'forwards'});
    palco.querySelector('.carimbo').animate([{opacity: 0, transform: 'rotate(-12deg) scale(3)'}, {opacity: 1, transform: 'rotate(-12deg) scale(1)'}], {duration: 320, delay: 1500, easing: 'ease-in', fill: 'forwards'});
  } else palco.querySelector('.carimbo').style.opacity = 1;
  setTimeout(function () {
    historico = historico.concat([r]).slice(-MAX); desenharMural();
    var novo = mural.querySelector('figure');
    if (novo && novo.animate) novo.animate([{opacity: 0, transform: 'scale(1.6)'}, {opacity: 1}], {duration: 500});
  }, TEMPO * .55);
  setTimeout(function () { rodando = false; if (fila.length) mostrar(fila.shift()); else modoVideo(true); }, TEMPO);
}
function receber(r, animar) {
  if (!r || !r.img || vistos[r.id]) return; vistos[r.id] = 1;
  if (!animar) { historico = historico.concat([r]).slice(-MAX); return; }
  fila.push(r); if (!rodando) mostrar(fila.shift());
}

// Rede: pergunta só o que chegou depois do último id; o ETag faz a resposta vazia custar um 304.
function buscar(primeira) {
  fetch('./tv.php' + (ultimo ? '?desde=' + encodeURIComponent(ultimo) : ''), {cache: 'no-cache'}).then(function (r) { return r.status === 200 ? r.json() : null; }).then(function (j) {
    if (!j) return;
    if (primeira) contagem = j.total;
    j.ids.forEach(function (id, i) {
      if (primeira && i < j.ids.length - MAX) vistos[id] = 1; else receber({id: id, img: './tv.php?img=' + id}, !primeira);
    });
    if (j.ids.length) ultimo = j.ids[j.ids.length - 1];
    if (primeira) desenharMural();
  }).catch(function () {}).then(function () { setTimeout(buscar, INTERVALO * (document.hidden ? 4 : 1)); });
}

// Mesmo aparelho (teste sem rede): o jogo grava em localStorage.
function lerLocal() { try { return JSON.parse(localStorage.getItem('cb_tv')) || []; } catch (e) { return []; } }
addEventListener('storage', function (e) { if (e.key === 'cb_tv') lerLocal().forEach(function (r) { receber(r, true); }); });

// Tela sempre acesa e página renovada de madrugada (navegador de TV vaza memória em dias seguidos).
function acordar() { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); }
document.addEventListener('visibilitychange', function () { if (!document.hidden) acordar(); });
acordar();
setInterval(function () { var h = new Date().getHours(); if (h === 4 && performance.now() > 36e5 && !rodando) location.reload(); }, 6e5);

fetch('../assets/tv/playlist.json', {cache: 'no-cache'}).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }).then(function (l) {
  lista = Array.isArray(l) ? l : []; if (lista.length) { tocar(0); modoVideo(true); }
});

function falso() {
  var W = 432, H = 528, c = document.createElement('canvas'), x = c.getContext('2d'), s = Math.random;
  c.width = W; c.height = H; x.fillStyle = '#fffdf6'; x.fillRect(0, 0, W, H); x.strokeStyle = '#203b80'; x.lineWidth = 7;
  x.beginPath(); x.moveTo(50, H); x.bezierCurveTo(50, 455, 121, 403, 216, 403); x.bezierCurveTo(311, 403, 381, 455, 381, H); x.closePath(); x.stroke();
  x.beginPath(); x.ellipse(216, 268, 125, 157, 0, 0, 7); x.stroke();
  x.fillStyle = ['#203b80', '#111', '#c8102e'][s() * 3 | 0]; if (s() < .7) { x.fillRect(86, 98, 260, 18); x.fillRect(146, 30 + s() * 20, 140, 72); }
  x.beginPath(); x.arc(170, 238, 12, 0, 7); x.arc(262, 238, 12, 0, 7); x.fill();
  x.beginPath(); x.arc(216, 323, 42, .3, Math.PI - .3); x.stroke();
  return {id: 'demo-' + Date.now() + s(), img: c.toDataURL('image/jpeg', .8)};
}
if (demo) { for (var i = 0; i < 5; i++) { receber(falso(), false); contagem++; } desenharMural(); setTimeout(function () { receber(falso(), true); }, 1500); setInterval(function () { receber(falso(), true); }, TEMPO + 14000); }
else buscar(true);
</script>
</body>
</html>
